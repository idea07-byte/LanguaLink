# ============================================================
# LinguaLink Backend — Application Properties
# ============================================================

spring.application.name=lingualink

# --- Server ---
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/lingualink
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
jwt.secret=lingualink-super-secret-key-change-this-in-production-must-be-256-bits
jwt.expiration=86400000

# --- CORS (allow React dev server) ---
cors.allowed-origins=http://localhost:5173

# --- Logging ---
logging.level.com.lingualink=DEBUG
logging.level.org.springframework.security=DEBUG

# --- AI Configuration (Phases 10, 11, 12, 13) ---
# Supported providers: gemini, ollama (or auto-fallback)
ai.provider=${AI_PROVIDER:gemini}
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}
